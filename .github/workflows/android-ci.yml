name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build Android APKs
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Prepare persistent release signing
        shell: bash
        env:
          VETUSTUS_KEYSTORE_B64: ${{ secrets.VETUSTUS_KEYSTORE_B64 }}
        run: |
          if [ -n "$VETUSTUS_KEYSTORE_B64" ]; then
            KEYSTORE_PATH="$RUNNER_TEMP/vetustus-release.jks"
            printf '%s' "$VETUSTUS_KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
            chmod 600 "$KEYSTORE_PATH"
            echo "VETUSTUS_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          else
            echo "No release keystore secret configured; release APK will be unsigned."
          fi

      - name: Run unit tests and build APKs
        env:
          VETUSTUS_KEYSTORE_PASSWORD: ${{ secrets.VETUSTUS_KEYSTORE_PASSWORD }}
          VETUSTUS_KEY_ALIAS: ${{ secrets.VETUSTUS_KEY_ALIAS }}
          VETUSTUS_KEY_PASSWORD: ${{ secrets.VETUSTUS_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleDebug assembleRelease

      - name: Upload unit-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vetustus-micro-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VETUSTUS-Micro-Android-1.0.1-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: VETUSTUS-Micro-Android-1.0.1-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload apksigner bootstrap tool
        uses: actions/upload-artifact@v4
        with:
          name: android-apksigner-36.0.0
          path: |
            ${{ env.ANDROID_HOME }}/build-tools/36.0.0/apksigner
            ${{ env.ANDROID_HOME }}/build-tools/36.0.0/lib/apksigner.jar
          if-no-files-found: error
          retention-days: 1
